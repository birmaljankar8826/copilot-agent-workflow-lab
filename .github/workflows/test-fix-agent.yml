name: "Agent 5: Test Fix Agent — Auto-fixes failing tests and retries up to 3 times"

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to fix tests on
        required: true
      pr_number:
        description: PR number for comments
        required: true
      attempt:
        description: Attempt number
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  models: read

jobs:
  fix-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Jest to Capture Errors
        run: |
          npm test -- --passWithNoTests 2>&1 | tee jest_output.txt || true

      - name: Fix Failing Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: node scripts/test-fix-agent.js

      - name: Verify fixes pass before committing
        id: verify
        shell: bash
        run: |
          set +e
          npm test -- --passWithNoTests 2>&1 | tee verify_output.txt
          JEST_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$JEST_EXIT" >> $GITHUB_OUTPUT
          if [ $JEST_EXIT -eq 0 ]; then
            echo "All tests pass — committing fixes"
          else
            echo "Tests still failing after fix — skipping commit to avoid overwriting with broken code"
            cat verify_output.txt
          fi

      - name: Commit Fixed Tests
        if: steps.verify.outputs.exit_code == '0'
        run: |
          git config user.name "AI Test Fix Agent"
          git config user.email "actions@github.com"
          git add tests/
          if [ -f fix_results.txt ] && [ -s fix_results.txt ]; then
            while IFS= read -r file; do
              case "$file" in
                .github/*|*.yml|*.yaml) continue ;;
              esac
              [ -f "$file" ] && git add "$file"
            done < fix_results.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git stash --include-untracked
            git pull --rebase origin ${{ inputs.base_branch }}
            git stash pop || true
            git add tests/
            if [ -f fix_results.txt ] && [ -s fix_results.txt ]; then
              while IFS= read -r file; do
                case "$file" in
                  .github/*|*.yml|*.yaml) continue ;;
                esac
                [ -f "$file" ] && git add "$file"
              done < fix_results.txt
            fi
            git commit -m "fix: test cases auto-fixed (attempt ${{ inputs.attempt }})"
            git push origin ${{ inputs.base_branch }}
          fi

      - name: Post Fix Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fixed = fs.existsSync('fix_results.txt')
              ? fs.readFileSync('fix_results.txt', 'utf8').trim()
              : '';
            const fileList = fixed ? fixed.split('\n').map(f => '- ' + f).join('\n') : 'No files fixed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body: '## 🔧 AI Test Fix Agent — Attempt ${{ inputs.attempt }}\n\nFixed the following test files:\n' + fileList + '\n\nRe-running tests...'
            });

      - name: Trigger Test Runner
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test-runner.yml',
              ref: '${{ inputs.base_branch }}',
              inputs: {
                base_branch: '${{ inputs.base_branch }}',
                pr_number: '${{ inputs.pr_number }}',
                attempt: '${{ inputs.attempt }}'
              }
            });
