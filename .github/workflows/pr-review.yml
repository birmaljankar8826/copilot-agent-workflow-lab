name: Hybrid AI PR Review Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node (use stable LTS)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install OpenAI SDK
      - name: Install dependencies
        run: npm install openai

      # 4. Generate Git Diff
      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > diff.txt

      # 5. Get changed files list
      - name: Get Changed Files
        run: |
          git diff --name-only origin/${{ github.base_ref }} > files.txt

      # 6. Build full file context
      - name: Build Full Context
        run: |
          > full_context.txt

          while read file; do
            if [ -f "$file" ]; then
              echo "===== FILE: $file =====" >> full_context.txt
              cat "$file" >> full_context.txt
              echo -e "\n\n" >> full_context.txt
            fi
          done < files.txt

      # 7. Run AI Agent (OpenAI happens here)
      - name: Run AI PR Review Agent
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          REVIEW=$(node scripts/openai-pr-agent.js)

          if [ -z "$REVIEW" ]; then
            REVIEW="⚠️ No AI review generated"
          fi

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 8. Post PR Comment (NO OpenAI here!)
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.ai.outputs.review || '⚠️ Empty review' }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI PR Review Agent\n\n${review}`
            });