name: AI PR Review Agent (Bulletproof)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node (safe LTS)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install OpenAI SDK
      - name: Install dependencies
        run: npm install openai

      # Get PR Diff (safe + correct)
      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      # Get changed files
      - name: Get Changed Files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > files.txt

      # Build full file context safely
      - name: Build Full Context
        run: |
          > full_context.txt

          while read file; do
            if [ -f "$file" ]; then
              echo "===== FILE: $file =====" >> full_context.txt
              cat "$file" >> full_context.txt
              echo -e "\n\n" >> full_context.txt
            fi
          done < files.txt

      # Run AI Agent
      - name: Run AI Agent
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          REVIEW=$(node scripts/openai-pr-agent.js)

          if [ -z "$REVIEW" ]; then
            REVIEW="⚠️ No review generated"
          fi

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Post PR Comment (SAFE - NO github-script injection issues)
      - name: Post PR Comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai.outputs.review }}
        with:
          script: |
            const review = process.env.REVIEW || "⚠️ Empty review";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🤖 AI PR Review Agent\n\n" + review
            });