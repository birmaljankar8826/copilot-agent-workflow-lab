name: "Agent 1: PR Code Review — Detects bugs and blocks merge until fixed"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install openai eslint

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Get Changed Files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > files.txt

      - name: Build Full Context
        run: |
          > full_context.txt
          while read file; do
            # Skip temp/generated files to prevent cat circular write errors
            case "$file" in
              *.txt|*.json) continue ;;
            esac
            if [ -f "$file" ]; then
              echo "===== FILE: $file =====" >> full_context.txt
              cat "$file" >> full_context.txt
              echo -e "\n\n" >> full_context.txt
            fi
          done < files.txt

      # Run ESLint on changed JS files — deterministic bug detection
      - name: Run ESLint
        run: |
          JS_FILES=$(grep '\.js$' files.txt | tr '\n' ' ')
          if [ -n "$JS_FILES" ]; then
            npx eslint $JS_FILES --format json > eslint_output.json || true
          else
            echo "[]" > eslint_output.json
          fi

      # Writes review_result.json and review_verdict.txt
      - name: Run AI Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/openai-pr-agent.js

      # Post review summary + individual inline comments
      - name: Post Inline PR Review
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');

            let reviewData;
            try {
              reviewData = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            } catch (e) {
              reviewData = { summary: '⚠️ Could not read review result.', verdict: 'UNKNOWN', comments: [] };
            }

            const verdict  = reviewData.verdict  || 'UNKNOWN';
            const summary  = reviewData.summary  || '';
            const comments = reviewData.comments || [];

            // github.event.pull_request.head.commit does NOT exist in the PR event payload.
            // Fetch the actual commit author via the GitHub API instead.
            const headSha = context.payload.pull_request.head.sha;
            const commitInfo = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   headSha
            });
            const commitAuthor = commitInfo.data.commit.author.name || '';
            const isBot = commitAuthor.includes('github-actions') || commitAuthor === 'AI Test Generator';

            console.log(`Verdict: ${verdict}, Bot commit: ${isBot}, Author: ${commitAuthor}`);

            // If this is a bot commit, dismiss any outstanding REQUEST_CHANGES reviews
            // so the merge button is not blocked after Auto-Fix
            if (isBot) {
              const reviews = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                pull_number: context.issue.number
              });
              for (const review of reviews.data) {
                if (review.state === 'CHANGES_REQUESTED') {
                  try {
                    await github.rest.pulls.dismissReview({
                      owner:       context.repo.owner,
                      repo:        context.repo.repo,
                      pull_number: context.issue.number,
                      review_id:   review.id,
                      message:     'Auto-fix has been applied — dismissing previous review. Please review the updated code.'
                    });
                    console.log('Dismissed REQUEST_CHANGES review ' + review.id);
                  } catch (e) {
                    console.log('Could not dismiss review ' + review.id + ': ' + e.message);
                  }
                }
              }
            }

            const verdictEmoji = verdict === 'APPROVED' ? '✅' : verdict === 'REJECTED' ? '❌' : '⚠️';

            // Step 1: Try each comment as an inline review comment
            const failed = [];
            let posted = 0;

            for (const c of comments) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id:   process.env.HEAD_SHA,
                  path:        c.file,
                  line:        Number(c.line),
                  side:        'RIGHT',
                  body:        `**[${(c.severity || 'ISSUE').toUpperCase()}]** ${c.comment}`
                });
                posted++;
                console.log(`✅ Inline comment: ${c.file}:${c.line}`);
              } catch (e) {
                console.error(`❌ Inline failed ${c.file}:${c.line} — ${e.message}`);
                failed.push(c);
              }
            }

            // Step 2: Build review body — include any comments that couldn't be posted inline
            let reviewBody = `## 🤖 AI PR Review Agent\n\n${verdictEmoji} **Verdict: ${verdict}**\n\n### 🧠 Summary\n${summary}`;

            if (isBot) {
              reviewBody += '\n\n> ✅ Auto-fix applied — this PR has been approved. Please review the changes in the Files Changed tab and merge when satisfied.';
            }

            if (failed.length > 0) {
              reviewBody += '\n\n### Issues in existing code\n' +
                failed.map(c =>
                  `- **\`${c.file}:${c.line}\`** [${(c.severity||'issue').toUpperCase()}]: ${c.comment}`
                ).join('\n');
            }

            // Step 3: Bot commits always APPROVE so the merge button is enabled after auto-fix.
            const event = isBot                ? 'APPROVE'
                        : verdict === 'REJECTED' ? 'REQUEST_CHANGES'
                        : verdict === 'APPROVED'  ? 'APPROVE'
                        : 'COMMENT';

            try {
              await github.rest.pulls.createReview({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.issue.number,
                commit_id:   process.env.HEAD_SHA,
                event,
                body:        reviewBody
              });
              console.log(`✅ Review submitted: ${verdict} (event: ${event})`);
            } catch (err) {
              console.error(`Review submit failed: ${err.message}`);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                body:         reviewBody
              });
            }

            console.log(`Inline: ${posted}/${comments.length} posted, ${failed.length} in summary`);

      # Fail the check so branch protection blocks the merge
      # Skip blocking if this was an auto-fix or bot commit — let the user decide next step
      - name: Block PR if bugs found
        run: |
          VERDICT=$(cat review_verdict.txt 2>/dev/null || echo "UNKNOWN")
          # Use git log to get the actual commit author — the event payload does not include this field
          COMMIT_AUTHOR=$(git log -1 --format='%an' HEAD)
          echo "Review verdict: $VERDICT"
          echo "Commit author: $COMMIT_AUTHOR"
          if [[ "$COMMIT_AUTHOR" == *"github-actions"* ]] || [[ "$COMMIT_AUTHOR" == "AI Test Generator" ]]; then
            echo "ℹ️ Bot commit — review posted but merge not blocked."
            exit 0
          fi
          if [ "$VERDICT" = "REJECTED" ]; then
            echo "❌ PR blocked — bugs were found. See inline review comments for details."
            exit 1
          fi
          echo "✅ PR approved — no bugs found."
