name: Issue Agent Workflow

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: AI Issue Triage
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : "";

            let labels = [];
            let comment = "";

            if (title.includes("bug") || body.includes("error") || body.includes("crash")) {
              labels.push("bug", "high-priority");
              comment = "This issue is classified as a BUG with HIGH priority.";
            } 
            else if (title.includes("feature") || body.includes("improve") || body.includes("enhancement")) {
              labels.push("enhancement");
              comment = "This issue is a FEATURE REQUEST.";
            } 
            else {
              labels.push("question");
              comment = "This issue is classified as a QUESTION.";
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labels
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });