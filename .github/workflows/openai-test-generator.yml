name: AI Unit Test Generator

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install openai

      - name: Get Changed Files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD > files.txt

      - name: Generate Unit Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/openai-test-generator.js

      - name: Run Jest
        run: |
          npm test -- --coverage || true

      - name: Commit Generated Tests
        run: |
          git config --global user.name "AI Test Generator"
          git config --global user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: AI generated unit tests"

          git push origin HEAD:${{ github.head_ref }}

      - name: Comment On PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let generated = [];

            try {
              generated = JSON.parse(
                fs.readFileSync(
                  'generated_tests.json',
                  'utf8'
                )
              );
            } catch (e) {}

            const body =
              generated.length === 0
                ? '🤖 No new tests generated.'
                : `🤖 Generated ${generated.length} test files\n\n` +
                  generated.map(
                    g => `- ${g.test}`
                  ).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });