name: AI Unit Test Generator

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    if: ${{ github.event.pull_request.merged == true }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install openai

      - name: Determine Changed Files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} > files.txt
          echo "Changed Files:"
          cat files.txt

      - name: Generate Unit Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/openai-test-generator.js

      - name: Run Jest
        run: |
          npm test -- --coverage || true

      - name: Commit Generated Tests
        run: |
          git config --global user.name "AI Test Generator"
          git config --global user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No generated tests"
            exit 0
          fi

          git commit -m "chore: AI generated unit tests"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}

      - name: Comment on Merged PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🤖 Unit tests have been generated and committed to `${{ github.event.pull_request.base.ref }}` after merge.'
            });
