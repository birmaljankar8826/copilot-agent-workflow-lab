name: "Agent 3: Unit Test Generator — Generates Jest tests after PR is merged"

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  generate-tests:
    if: ${{ github.event.pull_request.merged == true }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Determine Changed Files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} > files.txt
          echo "Changed Files:"
          cat files.txt

      - name: Generate Unit Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/openai-test-generator.js

      - name: Commit Generated Tests
        id: commit
        run: |
          git config --global user.name "AI Test Generator"
          git config --global user.email "actions@github.com"

          # Stage test files only — check this BEFORE adding generated_tests.json
          # so a newly created empty generated_tests.json doesn't fool the diff check
          git add tests/

          if git diff --cached --quiet; then
            echo "No test files generated."
            echo "tests_generated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git add generated_tests.json
          git commit -m "chore: AI generated unit tests"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
          echo "tests_generated=true" >> $GITHUB_OUTPUT

      - name: Comment on Merged PR
        if: steps.commit.outputs.tests_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🤖 Unit tests generated and committed to `${{ github.event.pull_request.base.ref }}`. Running tests now...'
            });

      - name: Trigger Test Runner
        if: steps.commit.outputs.tests_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test-runner.yml',
              ref: '${{ github.event.pull_request.base.ref }}',
              inputs: {
                base_branch: '${{ github.event.pull_request.base.ref }}',
                pr_number: String(context.payload.pull_request.number),
                attempt: '1'
              }
            });
