name: AI Unit Test Generator

on:
  workflow_run:
    workflows:
      - AI PR Review Agent (Bulletproof)
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install openai

      - name: Determine Changed Files
        run: |
          git fetch origin main

          git diff --name-only origin/main...HEAD > files.txt

          echo "Changed Files:"
          cat files.txt

      - name: Generate Unit Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/openai-test-generator.js

      - name: Run Jest
        run: |
          npm test -- --coverage || true

      - name: Commit Generated Tests
        run: |
          git config --global user.name "AI Test Generator"
          git config --global user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No generated tests"
            exit 0
          fi

          git commit -m "chore: AI generated unit tests"

          git push origin HEAD:${{ github.event.workflow_run.head_branch }}

      - name: Find Related PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: '${{ github.event.workflow_run.head_sha }}'
              });

            if (prs.data.length > 0) {
              core.setOutput('number', prs.data[0].number);
            }

      - name: Comment On PR
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: '🤖 Unit tests have been generated automatically after the review workflow completed successfully.'
            });