name: AI Conflict Resolver Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-conflicts:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/resolve')
    runs-on: ubuntu-latest

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref:         ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token:       ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Merge base branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ steps.pr.outputs.base_ref }}
          if git merge origin/${{ steps.pr.outputs.base_ref }}; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ Merged cleanly — no conflicts"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "⚠️ Merge conflicts detected"
            git diff --name-only --diff-filter=U
          fi

      - name: Parse resolve strategy
        id: strategy
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if echo "$COMMENT" | grep -qi "current"; then
            echo "value=current" >> $GITHUB_OUTPUT
          elif echo "$COMMENT" | grep -qi "incoming"; then
            echo "value=incoming" >> $GITHUB_OUTPUT
          else
            echo "value=merge" >> $GITHUB_OUTPUT
          fi

      - name: Run Conflict Resolver
        if: steps.merge.outputs.has_conflicts == 'true'
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          RESOLVE_STRATEGY: ${{ steps.strategy.outputs.value }}
        run: node scripts/conflict-resolver.js

      - name: Commit resolved files
        id: commit
        run: |
          # Check if resolver produced any results
          if [ ! -f resolved_files.txt ] || [ ! -s resolved_files.txt ]; then
            echo "resolved=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Stage each resolved file
          while read file; do
            if [ -f "$file" ]; then
              git add "$file"
              echo "Staged: $file"
            fi
          done < resolved_files.txt

          # Verify no unmerged files remain
          STILL_UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$STILL_UNMERGED" ]; then
            echo "❌ Still unmerged after resolution: $STILL_UNMERGED"
            echo "resolved=false" >> $GITHUB_OUTPUT
            git merge --abort
            exit 0
          fi

          git commit -m "resolve: AI resolved merge conflicts"
          git push origin ${{ steps.pr.outputs.head_ref }}
          echo "resolved=true" >> $GITHUB_OUTPUT

      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resolved = '${{ steps.commit.outputs.resolved }}' === 'true';
            const summary  = fs.existsSync('resolve_summary.txt')
              ? fs.readFileSync('resolve_summary.txt', 'utf8')
              : '';
            const body = resolved
              ? '## 🔀 AI Conflict Resolver\n\n' + summary + '\n\n✅ Conflicts resolved and committed. PR Review will run automatically.'
              : '${{ steps.merge.outputs.has_conflicts }}' === 'false'
                ? '## 🔀 AI Conflict Resolver\n\n✅ No conflicts found — branch is already clean.'
                : '## 🔀 AI Conflict Resolver\n\n⚠️ Could not resolve all conflicts automatically. Please resolve manually.';
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body
            });
