name: AI Auto-Fix Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    # Only run when someone comments /fix on a PR
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            console.log(`PR: ${pr.data.head.ref} -> ${pr.data.base.ref}`);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref:         ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token:       ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install openai eslint

      - name: Get PR diff
        run: |
          git fetch origin ${{ steps.pr.outputs.base_ref }}
          git diff origin/${{ steps.pr.outputs.base_ref }}...HEAD > diff.txt
          git diff --name-only origin/${{ steps.pr.outputs.base_ref }}...HEAD > files.txt
          echo "Changed files:"; cat files.txt

      - name: Build full context
        run: |
          > full_context.txt
          while read file; do
            if [ -f "$file" ]; then
              echo "===== FILE: $file =====" >> full_context.txt
              cat "$file" >> full_context.txt
              echo -e "\n\n" >> full_context.txt
            fi
          done < files.txt

      - name: Run ESLint
        run: |
          JS_FILES=$(grep '\.js$' files.txt | tr '\n' ' ')
          if [ -n "$JS_FILES" ]; then
            npx eslint $JS_FILES --format json > eslint_output.json || true
          else
            echo "[]" > eslint_output.json
          fi

      - name: Run AI Review to get findings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/openai-pr-agent.js

      - name: Run Auto-Fix Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/auto-fix-agent.js

      # Create a new branch for the fixes — do NOT commit directly to the PR branch
      - name: Create fix branch and open review PR
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const fs     = require('fs');
            const { execSync } = require('child_process');

            const summary   = fs.readFileSync('fix_summary.txt', 'utf8');
            const headRef   = process.env.HEAD_REF;
            const fixBranch = `autofix/${headRef}`;

            // Set up git identity
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            // Create and switch to the fix branch from current HEAD
            execSync(`git checkout -b ${fixBranch}`);

            // Stage all fixed files
            execSync('git add -A');

            // Check if there are actual changes
            let hasChanges = true;
            try {
              execSync('git diff --staged --quiet');
              hasChanges = false;
            } catch (e) {
              hasChanges = true;
            }

            if (!hasChanges) {
              // Nothing to fix — post a comment and exit
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo:  context.repo.repo,
                body:  `## 🤖 Auto-Fix Agent\n\n✅ No changes needed — the code looks clean already.`
              });
              return;
            }

            // Commit the fixes
            execSync(`git commit -m "🤖 Auto-fix: resolve AI review findings"`);

            // Push the fix branch
            execSync(`git push origin ${fixBranch} --force`);

            // Open a PR: fixBranch → original PR branch (for developer review)
            let fixPr;
            try {
              fixPr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `🤖 Auto-fix for #${context.issue.number}: ${headRef}`,
                head:  fixBranch,
                base:  headRef,
                body: `## 🤖 AI Auto-Fix Proposal\n\nThis PR contains AI-generated fixes for the review findings in #${context.issue.number}.\n\n**Please review these changes carefully before merging.**\n\n### What was fixed\n${summary}\n\n---\n> Merge this PR into \`${headRef}\` once you are satisfied with the fixes. The review agent will re-run automatically.`
              });
            } catch (e) {
              // PR might already exist — update it instead
              console.log('PR creation failed, branch already has an open PR:', e.message);
            }

            // Post a comment on the original PR linking to the fix PR
            const prLink = fixPr ? `\n\n👉 **Review the proposed fixes here: #${fixPr.data.number}**` : `\n\nFix branch \`${fixBranch}\` has been updated.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body: `## 🤖 Auto-Fix Agent\n\n${summary}${prLink}\n\n> The fixes have **not** been applied yet. Review and merge the fix PR when you are happy with the changes.`
            });
